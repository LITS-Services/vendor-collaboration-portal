<div class="px-1 py-2" [formGroup]="form">
  <div class="row mb-3">
    <div class="col-md-8 mb-2">
      <label class="form-label small">Item Name</label>
      <input class="form-control form-control-sm" [value]="itemName" disabled>
    </div>
    <div class="col-md-4 mb-2">
      <label class="form-label small">Ordered Qty</label>
      <input class="form-control form-control-sm" [value]="orderedQty" disabled>
    </div>
  </div>

  <div class="alert alert-light border text-center text-muted py-2 my-3 rounded" *ngIf="itemsForm.length === 0 && !loading">
    <i class="ft-info me-1"></i> No shipment detail has been added yet.
  </div>

  <div class="table-card table-card--shipment-lines" *ngIf="itemsForm.length > 0">
    <div class="table__row table__row--head table__row--shipment-lines">
      <div class="text-center">#</div>
      <div class="text-center">QTY TO SHIP</div>
      <div class="text-center">SHIPMENT DATE</div>
    </div>

    <div class="table-scroll table-scroll--shipment-lines" formArrayName="items">
      <div class="table__row table__row--shipment-lines" *ngFor="let item of itemsForm.controls; let i = index" [formGroupName]="i">
        <div class="text-center mono">{{ i + 1 }}</div>
        <div>
          <input type="number" class="form-control form-control-sm" formControlName="quantity" min="1"
                 [class.is-invalid]="item.get('error')?.value">
          <small class="text-danger d-block mt-1" *ngIf="item.get('error')?.value">
            <i class="ft-alert-circle me-1"></i>{{ item.get('error')?.value }}
          </small>
        </div>
        <div>
          <input type="date" class="form-control form-control-sm" formControlName="shipmentDate">
        </div>
      </div>
    </div>
  </div>

  <div class="text-end fw-bold mt-3" *ngIf="itemsForm.length > 0">
    Total Qty to Ship:
    <span [ngClass]="totalShipped > orderedQty ? 'text-danger' : 'text-success'">
      {{ totalShipped }} / {{ orderedQty }}
    </span>
  </div>

  <div class="mt-3">
    <button type="button" class="btn btn-outline-primary btn-sm d-inline-flex align-items-center" (click)="addRow()">
      <i class="ft-plus me-1"></i> Add Row
    </button>
  </div>
</div>
