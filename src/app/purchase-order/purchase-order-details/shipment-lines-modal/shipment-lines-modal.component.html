<div class="px-3 py-3" [formGroup]="form">
  <!-- Header Info -->
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <div>
      <h6 class="text-muted text-uppercase mb-1" style="font-size: 0.75rem; letter-spacing: 0.5px;">Item Name</h6>
      <h5 class="fw-bold m-0 text-dark">{{ itemName }}</h5>
    </div>
    <div class="text-end">
      <h6 class="text-muted text-uppercase mb-1" style="font-size: 0.75rem; letter-spacing: 0.5px;">Ordered Qty</h6>
      <h5 class="fw-bold m-0 text-dark">{{ orderedQty }}</h5>
    </div>
  </div>

  <!-- Messages -->
  <div class="alert alert-light border text-center text-muted py-2 my-3 rounded" style="font-size: 0.85rem;" *ngIf="itemsForm.length === 0 && !loading">
    <i class="ft-info me-1"></i> No shipment detail has been added yet.
  </div>

  <!-- Table -->
  <div class="table-responsive" *ngIf="itemsForm.length > 0">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light text-muted" style="font-size: 0.8rem; text-transform: uppercase;">
        <tr>
          <th width="10%" class="text-center border-0 rounded-start">#</th>
          <th width="45%" class="border-0">Qty to Ship</th>
          <th width="45%" class="border-0 rounded-end">Shipment Date</th>
        </tr>
      </thead>
      <tbody formArrayName="items" class="border-top-0">
        <tr *ngFor="let item of itemsForm.controls; let i = index" [formGroupName]="i">
          <td class="text-center text-muted fw-bold">{{ i + 1 }}</td>
          <td>
            <div class="position-relative">
              <input type="number" class="form-control form-control-sm" formControlName="quantity" min="1" 
                     [class.is-invalid]="item.get('error')?.value" style="max-width: 150px;">
              <small class="text-danger d-block mt-1" style="font-size: 0.75rem;" *ngIf="item.get('error')?.value">
                <i class="ft-alert-circle me-1"></i>{{ item.get('error')?.value }}
              </small>
            </div>
          </td>
          <td>
            <input type="date" class="form-control form-control-sm" formControlName="shipmentDate" style="max-width: 180px;">
          </td>
        </tr>
      </tbody>
      <tfoot class="bg-light">
        <tr>
          <td colspan="3" class="text-end border-0 pe-4">
            <span class="fw-bold text-muted me-2" style="font-size: 0.85rem;">Total Qty to Ship:</span>
            <span class="fw-bold fs-6" [ngClass]="totalShipped > orderedQty ? 'text-danger' : 'text-success'">
              {{ totalShipped }} <span class="text-muted fw-normal fs-6">/ {{ orderedQty }}</span>
            </span>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- Add Button -->
  <div class="mt-4 pt-3 border-top">
    <button type="button" class="btn btn-outline-primary btn-sm d-inline-flex align-items-center fw-bold" (click)="addRow()" style="border-radius: 4px;">
      <i class="ft-plus me-1"></i> Add Row
    </button>
  </div>
</div>
