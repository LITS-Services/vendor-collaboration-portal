<div class="card shadow-sm p-3 border border-success rounded mb-3" [formGroup]="form">

  <!-- HEADER ROW -->
  <div class="d-flex justify-content-between align-items-start mb-3">
    <h5 class="mt-2 fw-bold">Invoice Details</h5>
    <button class="btn btn-primary btn-sm" (click)="sendForPayment()" [disabled]="isEdit">
      Send for Payment
    </button>
  </div>

  <!-- Invoice / PO / Vendor Fields -->
  <div class="row">
    <div *ngIf="invoiceExists" class="col-md-4 mb-2">
      <label class="form-label small">Invoice No</label>
      <input class="form-control form-control-sm" formControlName="invoiceNo" disabled>
    </div>

    <div *ngIf="invoiceExists" class="col-md-4 mb-2">
      <label class="form-label small">Invoice Date</label>
      <input class="form-control form-control-sm" formControlName="invoiceDate" disabled>
    </div>

    <div class="col-md-4 mb-2">
      <label class="form-label small">PO No</label>
      <input class="form-control form-control-sm" [value]="purchaseOrderNo" disabled>
    </div>

    <div class="col-md-4 mb-2">
      <label class="form-label small">Vendor</label>
      <input class="form-control form-control-sm" [value]="vendorName" disabled>
    </div>

    <div class="col-md-4 mb-2">
      <label class="form-label small">GRN No</label>
      <input class="form-control form-control-sm" [value]="grNumber" disabled>
    </div>

    <div class="col-md-4 mb-2">
      <label class="form-label small">Payment Terms</label>
      <input class="form-control form-control-sm" formControlName="paymentTerms" [disabled]="isEdit">
    </div>

    <div class="col-md-4 mb-2">
      <label class="form-label small">Due Date</label>
      <input type="date" class="form-control form-control-sm" formControlName="dueDate" [disabled]="isEdit">
    </div>

    <div class="col-8 mb-2">
      <label class="form-label small">Remarks</label>
      <textarea class="form-control form-control-sm" formControlName="remarks" rows="2" [disabled]="isEdit"></textarea>
    </div>
  </div>

  <!-- ITEMS SECTION -->
  <div class="mt-3">
    <div class="d-flex justify-content-between align-items-center mb-2 cursor-pointer" (click)="toggleItems()">
      <h5 class="section-title m-0">Items</h5>
      <i class="ft-chevron-down transition-icon" [ngClass]="{ 'rotate-icon': itemsExpanded }"></i>
    </div>

    <div class="expand-wrapper" [ngClass]="{ 'expanded': itemsExpanded }">
      <div class="table-responsive">
        <table class="table custom-modern-table">
          <thead>
            <tr>
              <th>Item</th>
              <th class="text-center">Accepted Qty</th>
              <th class="text-end">Amount</th>
            </tr>
          </thead>
          <tbody formArrayName="items">
            <tr *ngFor="let item of itemsForm.controls; let i = index" [formGroupName]="i">
              <td>{{ item.get('itemName')?.value }}</td>
              <td class="text-center">{{ item.get('acceptedQuantity')?.value }}</td>
              <td class="text-end fw-bold">{{ item.get('totalAmount')?.value | number:'1.2-2' }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
