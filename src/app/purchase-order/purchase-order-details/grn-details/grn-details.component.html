@if (grnDetails?.grNumber) {
<div class="card shadow-sm p-3 border border-success rounded mb-3">
    <div class="row">
        <div class="col-md-4 mb-2">
            <label class="form-label small">GRN No</label>
            <input class="form-control form-control-sm" [value]="grnDetails.grNumber" disabled>
        </div>

        <div class="col-md-4 mb-2">
            <label class="form-label small">PO No</label>
            <input class="form-control form-control-sm" [value]="grnDetails.purchaseOrderNo" disabled>
        </div>

        <div class="col-md-4 mb-2">
            <label class="form-label small">Vendor</label>
            <input class="form-control form-control-sm" [value]="grnDetails.vendorName" disabled>
        </div>

        <div class="col-md-4 mb-2">
            <label class="form-label small">Receiver</label>
            <input class="form-control form-control-sm" [value]="grnDetails.receiverName" disabled>
        </div>

        <div class="col-md-4 mb-2">
            <label class="form-label small">Status</label>
            <input class="form-control form-control-sm" [value]="grnDetails.requestStatus" disabled>
        </div>

        <div class="col-md-4 mb-2">
            <label class="form-label small">Remarks</label>
            <input class="form-control form-control-sm" [value]="grnDetails.remarks" disabled>
        </div>

    </div>
</div>
<!-- Items Table -->
<div class="d-flex justify-content-between align-items-center mb-2 cursor-pointer" (click)="toggleItems()">
    <h5 class="section-title m-0">Items</h5>
    <i class="ft-chevron-down transition-icon" [ngClass]="{ 'rotate-icon': itemsExpanded }"></i>
</div>

<div class="expand-wrapper" [ngClass]="{ 'expanded': itemsExpanded }">
    <div class="table-card table-card--grn">
        <div class="table__row table__row--head table__row--grn">
            <div>ITEM</div>
            <div class="text-center">ORDERED QTY</div>
            <div class="text-center">RECEIVED QTY</div>
            <div class="text-center">RECEIVED DATE</div>
            <div>REMARKS</div>
        </div>

        <div class="table-scroll table-scroll--grn">
            <div class="table__row table__row--grn" *ngFor="let item of grnDetails.goodsReceiptItems">
                <div class="mono">{{ item.itemCode }}</div>
                <div class="text-center mono">{{ item.orderedQuantity }}</div>
                <div class="text-center mono">{{ item.receivedQuantity }}</div>
                <div class="text-center mono">{{ item.receivedDate | date:'yyyy-MM-dd' }}</div>
                <div class="table-cell-remarks">{{ item.remarks }}</div>
            </div>
        </div>
    </div>
</div>

@else {
    <div>GRN isn't received yet.</div>
}
