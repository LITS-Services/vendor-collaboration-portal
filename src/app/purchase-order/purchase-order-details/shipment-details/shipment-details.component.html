<!-- Shipment Form (MAIN CARD) -->
<div [class]="inModal ? 'px-1 py-2' : 'card shadow-sm p-3 border border-success rounded mb-3'" [formGroup]="form">

    <!-- HEADER ROW: Title + Top-right buttons -->
    <div class="d-flex justify-content-between align-items-start mb-3" *ngIf="!inModal">

        <h5 class="mt-2 fw-bold">
            {{ isEdit ? 'Update Shipment Details' : 'Add Shipment Details' }}
        </h5>

        <div class="d-flex align-items-center gap-2 flex-wrap">
            <!-- DELETE button only on update -->
            <button *ngIf="isEdit && !readyForPosting" class="btn btn-danger btn-sm" (click)="deleteShipment()">
                Cancel
            </button>

            <!-- SAVE / UPDATE button -->
            <button *ngIf="!readyForPosting" class="btn btn-primary btn-sm" (click)="save()">
                {{ isEdit ? 'Update Shipment Details' : 'Submit Shipment Details' }}
            </button>
        </div>
    </div>

    <!-- SHIPMENT FORM FIELDS -->
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label small">Shipment No</label>
            <input class="form-control form-control-sm" formControlName="shipmentNo" disabled>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label small">PR No</label>
            <input class="form-control form-control-sm" formControlName="prNo" disabled>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label small">PO No</label>
            <input class="form-control form-control-sm" formControlName="poNo" disabled>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label small">Transfer From</label>
            <input class="form-control form-control-sm" formControlName="transferFromCode" disabled>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label small">Transfer To</label>
            <input class="form-control form-control-sm" formControlName="transferToCode" disabled>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label small">Posting Date</label>
            <input type="date" class="form-control form-control-sm" formControlName="postingDate" disabled>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label small">Shipment Date</label>
            <input type="date" class="form-control form-control-sm" formControlName="shipmentDate" [attr.readonly]="readyForPosting ? true : null">
        </div>
    </div>


    <!-- ITEMS SECTION (NOW INSIDE THE SAME CARD) -->
    <div class="mt-3">

        <!-- Expand/Collapse Header -->
        <div class="d-flex justify-content-between align-items-center mb-2 cursor-pointer" (click)="toggleItems()">
            <h5 class="section-title m-0">Items</h5>
            <i class="ft-chevron-down transition-icon" [ngClass]="{ 'rotate-icon': itemsExpanded }"></i>
        </div>

        <!-- Expandable Content -->
        <div class="expand-wrapper" [ngClass]="{ 'expanded': itemsExpanded }" [formGroup]="form">
            <div class="table-card table-card--shipment">
                <div class="table__row table__row--head table__row--shipment">
                    <div>ITEM</div>
                    <div class="text-center">QUANTITY</div>
                    <div class="text-center">DELIVERY DATE</div>
                </div>

                <div class="table-scroll table-scroll--shipment" formArrayName="items">
                    <div class="table__row table__row--shipment" *ngFor="let item of itemsForm.controls; let i = index" [formGroupName]="i">
                        <div>
                            <span class="item-title">{{ item.get('itemName')?.value }}</span>
                        </div>
                        <div class="text-center d-flex justify-content-center gap-1">
                            <input type="number" min="0" class="form-control form-control-sm" formControlName="quantity">
                            <span class="required-star" *ngIf="!readyForPosting">*</span>
                        </div>
                        <div class="text-center d-flex justify-content-center gap-1">
                            <input type="date" class="form-control form-control-sm" formControlName="deliveryDate">
                            <span class="required-star" *ngIf="!readyForPosting">*</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
