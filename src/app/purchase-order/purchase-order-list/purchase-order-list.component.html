<section>
    <div class="row">
        <div class="col-12">

            <!-- Header -->
            <div class="row mb-3">
                <div class="col-md-12 d-flex align-items-center justify-content-between">
                    <h5 class="mb-0">{{ title }}</h5>
            
                    <div ngbDropdown class="d-inline-block toolbar-item filter-toolbar-item" placement="bottom-end" [autoClose]="'outside'">
                        <button type="button" class="toolbar-action-btn" id="filterDropdown" ngbDropdownToggle
                            [class.active-action]="selectedStatus" title="Filter">
                            <img src="assets/img/svg-icons/filter-icon.svg" alt="Filter" class="toolbar-icon" />
                            <span class="toolbar-label">Filter</span>
                            <span class="active-dot" *ngIf="selectedStatus"></span>
                        </button>
            
                        <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end shadow-lg toolbar-dropdown filter-dropdown" aria-labelledby="filterDropdown"
                            placement="bottom-end">
                            <div class="filter-header d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
                                <span class="filter-title">Filters</span>
                                <button type="button" class="btn btn-link btn-sm p-0 reset-all-btn" *ngIf="selectedStatus"
                                    (click)="selectedStatus = ''; loadPurchaseOrders()">
                                    Reset
                                </button>
                            </div>
                            <div class="filter-group mb-3">
                                <label for="statusFilter" class="filter-label">Status</label>
                                <select id="statusFilter" [(ngModel)]="selectedStatus" (change)="loadPurchaseOrders()"
                                    class="form-select form-select-sm filter-select">
                                    <option value="">All</option>
                                    <option value="Open">Open</option>
                                    <option value="Delivered">Delivered</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </div>
                            <div class="filter-footer d-flex align-items-center justify-content-end pt-2 border-top">
                                <button type="button" class="btn btn-outline-secondary btn-sm px-3" (click)="selectedStatus = ''; loadPurchaseOrders()">
                                    Reset
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <ngx-datatable class="bootstrap core-bootstrap" [rows]="purchaseOrders" [columnMode]="'force'"
                [headerHeight]="50" [footerHeight]="50" [columns]="columns" rowHeight="50" [limit]="10"
                [scrollbarH]="true" [loadingIndicator]="loading" [selected]="chkBoxSelected" [swapColumns]="false"
                [selectionType]="SelectionType.single" (sort)="onSort($event)"
                (select)="customChkboxOnSelect($event)" (rowClick)="onRowClick($event)" (activate)="onActivate($event)" (clicktype)="'single'">
                <ngx-datatable-column [width]="50" [sortable]="false" [canAutoResize]="false" [draggable]="false"
                    [resizeable]="false">
                    <!-- <ng-template ngx-datatable-header-template>
                        <div class="custom-control">
                            <input type="checkbox" [checked]="isAllSelected" (change)="toggleSelectAll($event)" />
                        </div>
                    </ng-template>
                    <ng-template ngx-datatable-cell-template let-value="value" let-isSelected="isSelected"
                        let-onCheckboxChangeFn="onCheckboxChangeFn">

                        <div class="custom-control custom-checkbox ">
                            <input type="checkbox" [checked]="isSelected" (change)="onCheckboxChangeFn($event)" />
                        </div>
                    </ng-template> -->
                </ngx-datatable-column>
                <ngx-datatable-column name="Sr. No." [resizeable]="false" [sortable]="false">
                    <ng-template let-rowIndex="rowIndex" let-value="value" ngx-datatable-cell-template>
                        <span>{{rowIndex + 1}}</span>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="PO No." prop="purchaseOrderNo" [sortable]="false">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <a href="javascript:void(0)">
                            {{ row.purchaseOrderNo }}
                        </a>
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Status" prop="requestStatus" [sortable]="false">
                    <ng-template ngx-datatable-cell-template let-row="row" let-value="value">
                        <span class="status-pill" [ngClass]="mapStatusKey(value)">
                            {{ value }}
                        </span>
                    </ng-template>
                </ngx-datatable-column>
                
                <ngx-datatable-column name="Requisition No." prop="requisitionNo" [sortable]="false">
                </ngx-datatable-column>

                <ngx-datatable-column name="Entity" prop="entityName" [sortable]="false">
                </ngx-datatable-column>

                <ngx-datatable-column name="RFQ No." prop="rfqNo" [sortable]="false">
                </ngx-datatable-column>

                <ngx-datatable-column name="Date" prop="createdDate" [sortable]="false">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        {{ row.createdDate | date:'yyyy-MM-dd' }}
                    </ng-template>
                </ngx-datatable-column>

                <ngx-datatable-column name="Action" [sortable]="false" [width]="70">
                    <ng-template let-row="row" ngx-datatable-cell-template>
                        <button type="button" class="btn btn-sm btn-link p-0 text-dark" (click)="downloadPdf(row, $event)" title="Download PO PDF" [disabled]="loadingPdfId === row.id">
                            <i class="fa fa-spinner fa-spin" *ngIf="loadingPdfId === row.id"></i>
                            <img *ngIf="loadingPdfId !== row.id" src="assets/img/svg-icons/pdf-icon.svg" class="btn-action-icon" alt="PDF" style="width: 17px; height: 17px;" />
                        </button>
                    </ng-template>
                </ngx-datatable-column>

            </ngx-datatable>
        </div>
    </div>
</section>
