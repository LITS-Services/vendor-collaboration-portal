<div class="modal-header">
  <h5 class="modal-title text-white" *ngIf="status !== 'in-process'">{{ 'RFQ_MODULE.QUOTE' | translate }}</h5>
  <h5 class="modal-title text-white" *ngIf="status === 'in-process'">{{ 'RFQ_MODULE.IN_PROCESS_REQUEST' | translate }}</h5>
  <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="closeDialog()"></button>
</div>

<div class="modal-body">
  <div class="card">
    <div class="card-body">
      <form [formGroup]="newRfqForm" (ngSubmit)="submitForm()">
        <div class="row">
          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'COMMON.RFQ_NO' | translate }}</label>
              <input type="text" [value]="data?.rfqNo" disabled class="form-control" />
            </div>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'COMMON.REQUISITION_NO' | translate }}</label>
              <!-- Assuming PR No. maps to requisitionNo or other property; adjust if needed -->
              <input type="text" [value]="data?.purchaseRequestNo" disabled class="form-control" />
            </div>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'COMMON.STATUS' | translate }}</label>
              <input type="text" [value]="data?.requestStatus | statusTranslate" disabled class="form-control" />
            </div>
          </div>

          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'RFQ_MODULE.OWNER' | translate }}</label>
              <input type="text" [value]="data?.owner" disabled class="form-control" />
            </div>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'COMMON.DATE' | translate }}</label>
              <input type="date" [value]="(data?.date | date:'yyyy-MM-dd')" disabled class="form-control" />
            </div>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'COMPANY_MODULE.CONTACT' | translate }}</label>
              <!-- If contact info is available in data, bind here -->
              <input type="text" [value]="data?.contact" disabled class="form-control" />
            </div>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'COMMON.ENTITY' | translate }}</label>
              <input type="text" [value]="data?.deliveryLocation" disabled class="form-control" />
            </div>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'RFQ_MODULE.START_DATE' | translate }}</label>
              <input type="date" [value]="(data?.startDate | date:'yyyy-MM-dd')" disabled class="form-control" />
            </div>
          </div>
          <div class="col-lg-4 col-md-4 col-sm-4 col-xs-6">
            <div class="form-group mb-2">
              <label>{{ 'RFQ_MODULE.END_DATE' | translate }}</label>
              <input type="date" [value]="(data?.endDate | date:'yyyy-MM-dd')" disabled class="form-control" />
            </div>
          </div>
          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="form-group mb-2">
              <label>{{ 'HISTORY_MODULE.PR_TITLE' | translate }}</label>
              <input type="text" [value]="data?.title" disabled class="form-control" />
            </div>
          </div>

          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12" *ngIf="status === 'in-process'">
            <div class="form-group mb-2">
              <label>{{ 'RFQ_MODULE.COMMENTS_REMARKS' | translate }}</label>
              <textarea [placeholder]="'RFQ_MODULE.ENTER_YOUR_REMARKS' | translate" class="form-control" rows="5"></textarea>
            </div>
          </div>

          <div class="col-12">
            <hr />
          </div>
        </div>
        <br />
      </form>

      <div class="col-12 mb-4" *ngIf="status === 'in-process'">
        <app-chat></app-chat>
      </div>

      <div class="col-12">
        <div style="position: relative;">
          <ngx-datatable class="bootstrap core-bootstrap" [rows]="newRfqData" [columnMode]="'force'" [headerHeight]="50"
            [footerHeight]="50" rowHeight="50" [limit]="5" [scrollbarH]="true">
            <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" [width]="50">
              <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
                <span>{{ rowIndex + 1 }}</span>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'COMMON.TYPE' | translate" prop="itemType" [width]="70">
              <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                <span>{{ (value || 'INVENTORY') | statusTranslate }}</span>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'COMMON.ITEM' | translate" prop="itemName" [width]="150"></ngx-datatable-column>
            <ngx-datatable-column [name]="'COMMON.DESCRIPTION' | translate" prop="description" [width]="150"></ngx-datatable-column>
            <ngx-datatable-column [name]="'RFQ_MODULE.QUOTE_AMOUNT' | translate" [width]="150">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <input type="number" class="form-control" [(ngModel)]="row.amount"
                  [placeholder]="'RFQ_MODULE.ENTER_AMOUNT' | translate" />
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'RFQ_MODULE.COMMENTS' | translate" [width]="200">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <input type="text" class="form-control" [(ngModel)]="row.comment"
                  [placeholder]="'RFQ_MODULE.ENTER_COMMENT' | translate" />
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'COMMON.ATTACHMENT' | translate" [width]="100">
              <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
                <button type="button" class="btn btn-sm btn-light" (click)="openAttachmentModal(rowIndex)">
                  <i class="ft-paperclip"></i>
                </button>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'COMMON.STATUS' | translate" prop="hasSubmittedBid">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <span *ngIf="row.hasSubmittedBid" class="badge bg-success">{{ 'STATUS.SUBMITTED' | translate }}</span>
                <span *ngIf="!row.hasSubmittedBid" class="badge bg-warning text-dark">{{ 'STATUS.PENDING' | translate }}</span>
              </ng-template>
            </ngx-datatable-column>

          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-footer">
  <button class="btn btn-primary" (click)="submitForm()">{{ 'COMMON.SUBMIT' | translate }}</button>
</div>
