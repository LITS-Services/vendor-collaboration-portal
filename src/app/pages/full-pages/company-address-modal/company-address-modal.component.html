  <div class="">
    <form #addressForm="ngForm" class="row align-items-end">
      <div class="form-group col-md-3">
        <label>Town</label>
        <input type="text" class="form-control" [(ngModel)]="address.town" name="town" placeholder="Town" />
      </div>
      <div class="form-group col-md-3">
        <label>Street</label>
        <input type="text" class="form-control" [(ngModel)]="address.street" name="street" required placeholder="Street" />
      </div>
      <div class="form-group col-md-3">
        <label>Building</label>
        <input type="text" class="form-control" [(ngModel)]="address.building" name="building" placeholder="Building name" />
      </div>
      <div class="form-group col-md-3">
        <label>Floor</label>
        <input type="text" class="form-control" [(ngModel)]="address.floor" name="floor" placeholder="Floor / Suite" />
      </div>
      <div class="form-group col-md-3">
        <label>Postal Address</label>
        <input type="text" class="form-control" [(ngModel)]="address.postalAddress" name="postalAddress" placeholder="P.O. Box" />
      </div>
      <div class="form-group col-md-3">
        <label>City</label>
        <input type="text" class="form-control" [(ngModel)]="address.city" name="city" required placeholder="City" />
      </div>
      <div class="form-group col-md-3">
        <label>State</label>
        <input type="text" class="form-control" [(ngModel)]="address.state" name="state" required placeholder="State" />
      </div>
      <div class="form-group col-md-3">
        <label>Zip Code</label>
        <input type="text" class="form-control" [(ngModel)]="address.zip" name="zip" required placeholder="Zip Code" />
      </div>
      <div class="form-group col-md-3">
        <label>Country</label>
        <input type="text" class="form-control" [(ngModel)]="address.country" name="country" required placeholder="Country" />
      </div>
      <div class="form-group col-md-3">
        <label class="checkbox-text">
          <input type="checkbox" [(ngModel)]="address.primary" name="primary">
          Primary Address
        </label>
      </div>
    </form>
    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-primary" (click)="submitAddress()">
        <i class="ft-chevrons-down me-1"></i>{{ isEditAddressMode ? 'Update' : 'Add' }} Address
      </button>
    </div>
  </div>
