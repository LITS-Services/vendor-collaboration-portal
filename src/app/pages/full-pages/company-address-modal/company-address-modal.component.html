
  <div>
    <form #addressForm="ngForm" class="row cstm-vertical-gap align-items-end">
      <div class="col-md-3 mt-1 form-group">
        <label>Street</label>
        <input type="text" class="form-control" [(ngModel)]="address.street" name="street" required />
      </div>
      <div class="col-md-3 mt-1 form-group">
        <label>City</label>
        <input type="text" class="form-control" [(ngModel)]="address.city" name="city" required />
      </div>
      <div class="col-md-3 mt-1 form-group">
        <label>State</label>
        <input type="text" class="form-control" [(ngModel)]="address.state" name="state" required />
      </div>
      <div class="col-md-3 mt-1 form-group">
        <label>Zip Code</label>
        <input type="text" class="form-control" [(ngModel)]="address.zip" name="zip" required />
      </div>
      <div class="col-md-3 mt-1 form-group">
        <label>Country</label>
        <input type="text" class="form-control" [(ngModel)]="address.country" name="country" required />
      </div>
      <div class="col-md-3 mt-1 form-group">
        <label class="checkbox-text">
          <input type="checkbox" [(ngModel)]="address.primary" name="primary">
          <span>Primary</span>
        </label>
      </div>
    </form>
    <div class="d-flex justify-content-end mt-2 mb-3">
      <button type="button" class="btn btn-primary" (click)="submitAddress()"> <i class="ft-chevrons-down me-1"></i>{{ isEditAddressMode ? 'Update' : 'Add' }} Address</button>
    </div>
  </div>
