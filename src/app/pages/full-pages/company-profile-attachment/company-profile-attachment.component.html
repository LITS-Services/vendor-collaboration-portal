<div class="modal-body">
  <div class="row">
    <!-- Document Type -->
    <div class="col-6 mb-3">
      <label for="documentType" class="form-label">Document Type</label>
      <select id="documentType" class="form-control" [(ngModel)]="attachment.documentType" [disabled]="readonly">
        <option value="">Select Document Type</option>
        <option *ngFor="let dt of documentTypes" [value]="dt">{{ dt }}</option>
      </select>
    </div>

    <!-- Attach File -->
    <div class="col-6 mb-3">
      <label for="fileInput" class="form-label">Attach File</label>
      <!-- <input
          type="file"
          id="fileInput"
          class="form-control"
          (change)="onFileChange($event)"
        /> -->
      <input type="file" id="fileInput" class="form-control file-div" (change)="onFileChange($event)" #fileInput
        [disabled]="readonly" />
      <div *ngIf="attachment.fileName && editIndex !== null" class="mt-1">
        <small class="text-muted">Current File: {{ attachment.fileName }}</small>
      </div>
    </div>

    <!-- Attached By -->
    <div class="col-6 mb-3" style="display: none;">
      <label for="attachedBy" class="form-label">Attached By</label>
      <input type="text" id="attachedBy" class="form-control" [(ngModel)]="attachment.attachedBy"
        placeholder="Enter your name" />
    </div>

    <!-- Expiry Date -->
    <div class="col-6 mb-3">
      <label for="expiryDate" class="form-label">Expiry Date</label>
      <input type="date" id="expiryDate" class="form-control" [(ngModel)]="attachment.expiryDate"
        [disabled]="readonly" />
    </div>

    <!-- Remarks -->
    <div class="col-12 mb-3">
      <label for="remarks" class="form-label">Remarks</label>
      <textarea id="remarks" class="form-control" [(ngModel)]="attachment.remarks" rows="3"
        placeholder="Add remarks here..." [disabled]="readonly"></textarea>
    </div>

    <!-- Attach Button -->
    <div class="col-12 d-flex justify-content-end mb-2">
      <button class="btn btn-primary" (click)="attachDocument()" *ngIf="!readonly"><i class="ft-chevrons-down me-1"></i>
        Add</button>
    </div>

    <!-- Table of Attached Files -->
    <div class="col-12 mt-2">
      <div class="pr-table-wrapper" appDatatableAutoResize [datatable]="datatable">
        <ngx-datatable
          #datatable
          class="bootstrap core-bootstrap"
          [rows]="attachedFiles"
          [columnMode]="'force'"
          [headerHeight]="42"
          [footerHeight]="50"
          rowHeight="42"
          [limit]="10"
          [scrollbarH]="isMobile">

          <!-- Document Type -->
          <ngx-datatable-column [flexGrow]="2" [minWidth]="160" name="Document Type" prop="documentType">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <span class="text-truncate fw-semibold" [title]="row.documentType">
                {{ row.documentType || '-' }}
              </span>
            </ng-template>
          </ngx-datatable-column>

          <!-- File Name -->
          <ngx-datatable-column [flexGrow]="2" [minWidth]="160" name="File Name" prop="fileName">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <span class="text-truncate fw-semibold" [title]="row.fileName">
                {{ row.fileName }}
              </span>
            </ng-template>
          </ngx-datatable-column>

          <!-- File Format -->
          <ngx-datatable-column [flexGrow]="1" [minWidth]="110" name="File Format" prop="format">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <span>{{ row.format || '-' }}</span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Expiry Date -->
          <ngx-datatable-column [flexGrow]="1" [minWidth]="130" name="Expiry Date" prop="expiryDate">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <span>{{ (row.expiryDate | date:'dd-MMM-yyyy') || '-' }}</span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Attached By -->
          <ngx-datatable-column [flexGrow]="1" [minWidth]="130" name="Attached By" prop="attachedBy">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <span>{{ row.attachedBy || '-' }}</span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Remarks -->
          <ngx-datatable-column [flexGrow]="2" [minWidth]="160" name="Remarks" prop="remarks">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <span class="text-truncate" [title]="row.remarks">
                {{ row.remarks || '-' }}
              </span>
            </ng-template>
          </ngx-datatable-column>

          <!-- Actions -->
          <ngx-datatable-column name="Actions" [sortable]="false" [flexGrow]="1" [minWidth]="90" [maxWidth]="110">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <div class="d-flex align-items-center gap-1" *ngIf="!readonly">
                <button class="btn btn-sm px-1 action-btn" type="button" (click)="editFile(row)" title="Edit">
                  <img src="assets/img/svg-icons/update-icon.svg" alt="Edit" style="width: 18px; height: 18px;" />
                </button>
                <button class="btn btn-sm px-1 action-btn" type="button" (click)="openAttachmentDeletionPopup(row)" title="Delete">
                  <img src="assets/img/svg-icons/delete-icon.svg" alt="Delete" style="width: 18px; height: 18px;" />
                </button>
              </div>
            </ng-template>
          </ngx-datatable-column>

        </ngx-datatable>
      </div>
    </div>
  </div>
</div>



<ng-container *ngIf="showAttachmentDeletePopup">
  <div class="modal" tabindex="-1" role="dialog" style="display: block; background: rgba(0, 0, 0, 0.5);">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Attachment</h5>
          <button type="button" class="btn-close" aria-label="Close" (click)="closeAttachmentDeletePopup()"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete this attachment?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" (click)="deleteFile()">Delete</button>
          <button type="button" class="btn btn-secondary" (click)="closeAttachmentDeletePopup()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
