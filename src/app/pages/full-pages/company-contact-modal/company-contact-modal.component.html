  <div>
    <form #contactForm="ngForm" (ngSubmit)="submitForm()" novalidate>
      <div class="row cstm-vertical-gap">
        <div class="col-xl-3 col-md-6 col-12 mt-1 form-group">
          <label>Description <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="contact.description" name="description"
            placeholder="Description / Title" required [class.is-invalid]="isFieldInvalid('description')">
          <div *ngIf="isFieldInvalid('description')" class="contact-field-error">
            {{ getFieldError('description') }}
          </div>
        </div>

        <div class="col-xl-3 col-md-6 col-12 mt-1 form-group">
          <label>Type <span class="text-danger">*</span></label>
          <select class="form-control" [(ngModel)]="contact.type" name="type" (change)="onTypeChange()" required
            [class.is-invalid]="isFieldInvalid('type')">
            <option value="" disabled hidden>Select Type</option>
            <option value="phoneNo">Phone / Mobile</option>
            <option value="Email">Email</option>
            <option value="Fax">Fax</option>
          </select>
          <div *ngIf="isFieldInvalid('type')" class="contact-field-error">
            {{ getFieldError('type') }}
          </div>
        </div>

        <div class="col-xl-3 col-md-6 col-12 mt-1 form-group">
          <label>{{ contactLabel }} <span class="text-danger">*</span></label>

          <div class="phone-input-group" *ngIf="isPhoneType; else emailContactInput">
            <div class="phone-country-select">
              <app-country-code-select
                [countries]="phoneCountries"
                [value]="countryIso"
                [invalid]="isFieldInvalid('contactNumber')"
                (valueChange)="onCountryIsoChange($event)">
              </app-country-code-select>
            </div>
            <input
              type="tel"
              inputmode="numeric"
              class="form-control phone-national-input"
              [value]="phoneNational"
              [placeholder]="phonePlaceholder"
              name="contactNumber"
              autocomplete="tel-national"
              (input)="onPhoneInput($event)"
              (blur)="onPhoneBlur()"
              [class.is-invalid]="isFieldInvalid('contactNumber')"
            >
          </div>

          <ng-template #emailContactInput>
            <input
              type="email"
              class="form-control"
              [(ngModel)]="contact.contactNumber"
              [placeholder]="contactPlaceholder"
              name="contactNumber"
              required
              [class.is-invalid]="isFieldInvalid('contactNumber')"
            >
          </ng-template>

          <div *ngIf="isFieldInvalid('contactNumber')" class="contact-field-error">
            {{ getFieldError('contactNumber') }}
          </div>
        </div>

        <div class="col-xl-3 col-md-6 col-12 mt-1 form-group" *ngIf="showExtension">
          <label>Extension</label>
          <input type="text" class="form-control" [(ngModel)]="contact.extension" name="extension" placeholder="Ext.">
        </div>

        <div class="col-12 mt-2">
          <div class="form-group mb-0">
            <label class="checkbox-text">
              <input type="checkbox" [(ngModel)]="contact.primary" name="primary">
              <span>Primary Contact</span>
            </label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-2 mb-3">
        <button type="button" class="btn btn-outline-secondary" *ngIf="isEditMode" (click)="cancelEditMode()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          {{ isEditMode ? 'Update' : 'Add' }} Contact
        </button>
      </div>
    </form>
  </div>
