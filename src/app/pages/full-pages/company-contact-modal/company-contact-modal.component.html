  <div>
    <form #contactForm="ngForm" class="row cstm-vertical-gap">
      <div class="col-md-3 mt-1 form-group">
        <label>Contact Role / Department</label>
        <select class="form-control" [(ngModel)]="contact.contactRole" name="contactRole">
          <option value="">Select Role</option>
          <option *ngFor="let role of contactRoleOptions" [value]="role">{{ role }}</option>
        </select>
      </div>

      <div class="col-md-3 mt-1 form-group">
        <label>Contact Person</label>
        <input type="text" class="form-control" [(ngModel)]="contact.contactPerson" name="contactPerson" placeholder="Full name">
      </div>

      <div class="col-md-3 mt-1 form-group">
        <label>Designation</label>
        <input type="text" class="form-control" [(ngModel)]="contact.designation" name="designation" placeholder="e.g. Sales Manager, CFO">
      </div>

      <div class="col-md-3 mt-1 form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" [(ngModel)]="contact.email" name="email" placeholder="contact@domain.com">
      </div>

      <div class="col-md-3 mt-1 form-group">
        <label>Description</label>
        <input type="text" class="form-control" [(ngModel)]="contact.description" name="description" placeholder="Description / Title" required>
      </div>

      <div class="col-md-3 mt-1 form-group">
        <label>Type</label>
        <select class="form-control" [(ngModel)]="contact.type" name="type" (change)="updateContactLabel()" required>
          <option value="phoneNo">Phone / Mobile</option>
          <option value="Email">Email</option>
          <option value="Fax">Fax</option>
        </select>
      </div>

      <div class="col-md-3 mt-1 form-group">
        <label>{{ contactLabel }}</label>
        <input
          [type]="inputType"
          class="form-control"
          [(ngModel)]="contact.contactNumber"
          [placeholder]="contactPlaceholder"
          name="contactNumber"
          required
        >
      </div>

      <div class="col-md-3 mt-1 form-group" *ngIf="showExtension">
        <label>Extension</label>
        <input type="text" class="form-control" [(ngModel)]="contact.extension" name="extension" placeholder="Ext.">
      </div>

      <div class="col-12 mt-2">
        <div class="form-group mb-0">
          <label class="checkbox-text">
            <input type="checkbox" [(ngModel)]="contact.primary" name="primary">
            <span>Primary Contact</span>
          </label>
        </div>
      </div>
    </form>
    <div class="d-flex justify-content-end mt-2 mb-3">
      <button type="button" class="btn btn-primary" (click)="submitForm()">
        {{ isEditMode ? 'Update' : 'Add' }} Contact
      </button>
    </div>
  </div>
