<section>
    <div class="row">
        <div class="col-12">

            <!-- Header -->
            <div class="row mb-3">
                <div class="col-md-12">
                    <h4 class="heading">{{ 'PR_MODULE.PURCHASE_REQUEST' | translate }}</h4>
                </div>
            </div>

            <ngx-datatable class="bootstrap core-bootstrap" [rows]="rfqData"
            [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50"
            rowHeight="50" [limit]="15" [scrollbarH]="true" [loadingIndicator]="loading"
            [selected]="chkBoxSelected" [swapColumns]="false" [selectionType]="SelectionType.checkbox"
            (sort)="onSort($event)" (select)="customChkboxOnSelect($event)">
            <ngx-datatable-column [width]="50" [sortable]="false" [canAutoResize]="false"
                [draggable]="false" [resizeable]="false">
                <ng-template ngx-datatable-header-template>
                    <div class="custom-control">
                        <input type="checkbox" [checked]="isAllSelected"
                            (change)="toggleSelectAll($event)" />
                    </div>
                </ng-template>
                <ng-template ngx-datatable-cell-template let-value="value" let-isSelected="isSelected"
                    let-onCheckboxChangeFn="onCheckboxChangeFn">

                    <div class="custom-control custom-checkbox ">
                        <input type="checkbox" [checked]="isSelected"
                            (change)="onCheckboxChangeFn($event)" />
                    </div>
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'COMMON.SR_NO' | translate" [resizeable]="false">
                <ng-template let-rowIndex="rowIndex" let-value="value" ngx-datatable-cell-template>
                    <span>{{rowIndex + 1}}</span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'COMMON.REQUISITION_NO' | translate" prop="requisitionNo" >
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'COMMON.STATUS' | translate" prop="status" >
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'COMMON.DATE' | translate" prop="date" >
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'RFQ_MODULE.OWNER' | translate" prop="owner" >
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'COMMON.DEPARTMENT' | translate" prop="department" >
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'HISTORY_MODULE.PR_TITLE' | translate" prop="title" >
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'HISTORY_MODULE.ACCOUNT' | translate" prop="account" >
            </ngx-datatable-column>
            
            <ngx-datatable-column [name]="'COMMON.TOTAL_AMOUNT' | translate" prop="totalAmount"
                [sortable]="false">
            </ngx-datatable-column>

        </ngx-datatable>
        </div>
    </div>
</section>
