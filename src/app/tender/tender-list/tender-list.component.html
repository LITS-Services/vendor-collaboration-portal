<section>
    <div class="row">
        <div class="col-12">
            <div class="row mb-3">
                <div class="col-md-12">
                    <h4 class="heading">{{ title }}</h4>
                </div>
            </div>
            <ngx-datatable class="bootstrap core-bootstrap" [rows]="tenderData"
            [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" [columns]="columns"
            rowHeight="'auto'" [limit]="15" [scrollbarH]="true" [loadingIndicator]="loading"
            [selected]="chkBoxSelected" [swapColumns]="false" [selectionType]="SelectionType.checkbox"
            (sort)="onSort($event)" (select)="customChkboxOnSelect($event)">
            <ngx-datatable-column [width]="50" [sortable]="false" [canAutoResize]="false"
                [draggable]="false" [resizeable]="false">
                <ng-template ngx-datatable-header-template>
                    <div class="custom-control">
                        <input type="checkbox" [checked]="isAllSelected"
                            (change)="toggleSelectAll($event)" />
                    </div>
                </ng-template>
                <ng-template ngx-datatable-cell-template let-value="value" let-isSelected="isSelected"
                    let-onCheckboxChangeFn="onCheckboxChangeFn">

                    <div class="custom-control custom-checkbox ">
                        <input type="checkbox" [checked]="isSelected"
                            (change)="onCheckboxChangeFn($event)" />
                    </div>
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [width]="50" [name]="'COMMON.SR_NO' | translate" [resizeable]="false">
                <ng-template let-rowIndex="rowIndex" let-value="value" ngx-datatable-cell-template>
                    <span>{{rowIndex + 1}}</span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'COMMON.REQUISITION_NO' | translate" prop="requisitionNo">
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'COMMON.STATUS' | translate" prop="status">
                <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                    <span>{{ value | statusTranslate }}</span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'COMMON.DATE' | translate" prop="date">
                <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                    <span>{{ value | date:'yyyy-MM-dd' }}</span>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'RFQ_MODULE.OWNER' | translate" prop="owner">
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'RFQ_MODULE.COMMENTS' | translate" prop="subject">
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'RFQ_MODULE.TOTAL_AMOUNT' | translate" prop="totalAmount"
                [sortable]="false">
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'RFQ_MODULE.QUOTE' | translate" prop="action"
            [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <button class="btn btn-sm" (click)="openQuotationBoxModal(row)">
                <img src="/assets/img/svg/auction.svg" width="30" height="30" alt="">
              </button>
              </ng-template>
        </ngx-datatable-column>
        <!-- <ngx-datatable-column name="Vendors" [width]="100" prop="action"
        [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <button class="btn btn-primary btn-sm" (click)="openVendorsModal(row)"
            >
            <i class="ft-user-check"></i>
          </button>
          </ng-template>
    </ngx-datatable-column> -->
        </ngx-datatable>
        </div>
    </div>
</section>
